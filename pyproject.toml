[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "resonance-field"
version = "0.1.0a0"
description = "Research platform for artificial cognitive ecosystems"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "ElephantRock" },
]
dependencies = [
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resonance"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: tests requiring PostgreSQL/pgvector",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/resonance/experiments/integration_campaign.py" = ["E501"]
"src/resonance/experiments/phase_boundary_campaign.py" = ["E501", "F401", "UP037"]
"src/resonance/experiments/phase_boundary_checkpoint.py" = ["E501"]
