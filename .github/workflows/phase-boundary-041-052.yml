name: Phase Boundary Experiments 041-052

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-boundary-041-052.yml"
      - "configs/experiments/phase-boundary-041-052.json"
      - "src/resonance/experiments/phase_boundary_campaign*.py"
      - "src/resonance/experiments/integration_campaign.py"
      - "src/resonance/market/**"
      - "src/resonance/reputation/**"

permissions:
  contents: read
  issues: write

jobs:
  run-phase-boundary-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESONANCE_TEST_DSN: postgresql://resonance:resonance@localhost:5432/resonance
      OUTPUT_DIR: artifacts/phase-boundary-041-052

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python package
        run: pip install -e '.[dev]'
      - name: Run Experiments 041-052
        run: >-
          python -m resonance.experiments.phase_boundary_campaign_cli
          --config configs/experiments/phase-boundary-041-052.json
          --code-sha "$GITHUB_SHA"
          --output-dir "$OUTPUT_DIR"
      - name: Upload phase-boundary evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-boundary-experiments-041-052
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
      - name: Build lab notebook comments
        run: |
          mkdir -p "$OUTPUT_DIR/comments"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          data = json.loads((output / "campaign.json").read_text())
          comments = output / "comments"

          for experiment in data["experiments"]:
              number = experiment["number"]
              selected = next(
                  arm for arm in experiment["arms"]
                  if arm["label"] == experiment["selected_label"]
              )
              metrics = selected["metrics"]
              lines = [
                  f"## Experiment {number:03d}",
                  "",
                  f"**Question:** {experiment['question']}",
                  "",
                  f"- Focus: `{experiment['focus']}`",
                  f"- Selected arm: `{experiment['selected_label']}`",
                  f"- Success: **{metrics['success_rate']:.6f}**",
                  f"- Agent/domain MI: **{metrics['agent_domain_mutual_information']:.6f}**",
                  f"- Specialization: **{metrics['mean_specialization']:.6f}**",
                  f"- Early incumbent share: **{metrics['early_incumbent_share']:.6f}**",
                  f"- Hard invariants: **{all(selected['invariants'].values())}**",
                  f"- Next focus: `{experiment['next_experiment_focus']}`",
              ]
              for key in (
                  "learning_timescale_cycles",
                  "shift_period",
                  "timescale_ratio",
                  "reference_effect",
                  "reference_sign",
                  "boundary_ratio",
                  "boundary_bracketed",
                  "gate_scale",
                  "candidate_effect",
                  "predicted_reference_sign",
                  "observed_reference_sign",
              ):
                  if key in experiment:
                      lines.append(f"- {key}: **{experiment[key]}**")
              if "validated" in experiment:
                  lines.append(f"- Validated: **{experiment['validated']}**")
              lines.extend(["", "Top arms:"])
              for arm in sorted(
                  experiment["arms"],
                  key=lambda item: item["utility"],
                  reverse=True,
              ):
                  arm_metrics = arm["metrics"]
                  lines.append(
                      f"- `{arm['label']}` — utility {arm['utility']:.6f}; "
                      f"success {arm_metrics['success_rate']:.6f}; "
                      f"incumbent {arm_metrics['early_incumbent_share']:.6f}; "
                      f"feasible {arm['feasible']}"
                  )
              (comments / f"experiment-{number:03d}.md").write_text("\n".join(lines) + "\n")

          summary = [
              "## Phase Boundary Campaign 041–052 — Final Synthesis",
              "",
              f"- Commit: `{data['code_sha']}`",
              f"- Learning timescale: **{data['learning_timescale_cycles']:.6f} cycles**",
              f"- Boundary shift: **{data['boundary_shift_cycles']:.6f} cycles**",
              f"- Boundary ratio θ: **{data['boundary_ratio']:.6f}**",
              f"- Boundary bracketed: **{data['boundary_bracketed']}**",
              f"- Candidate policy: `{data['candidate_label']}`",
              f"- Holdout validated: **{data['validated']}**",
              f"- Experiments completed: **{len(data['experiments'])}**",
              "",
              "Raw real-market evidence is retained in the workflow artifact `phase-boundary-experiments-041-052`.",
          ]
          (comments / "campaign-summary.md").write_text("\n".join(summary) + "\n")
          PY
      - name: Publish phase-boundary notebook to issue 17
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in "$OUTPUT_DIR"/comments/experiment-*.md; do
            gh issue comment 17 --repo "$GITHUB_REPOSITORY" --body-file "$file"
          done
          gh issue comment 17 --repo "$GITHUB_REPOSITORY" --body-file "$OUTPUT_DIR/comments/campaign-summary.md"
