name: Phase Boundary Experiments 041-052

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase-boundary-041-052.yml"
      - ".github/workflows/phase-boundary-step.yml"
      - "configs/experiments/phase-boundary-041-052.json"
      - "scripts/upsert_issue_comment.py"
      - "src/resonance/experiments/phase_boundary_campaign*.py"
      - "src/resonance/experiments/phase_boundary_checkpoint.py"
      - "src/resonance/experiments/phase_boundary_step_cli.py"
      - "src/resonance/experiments/integration_campaign.py"
      - "src/resonance/market/**"
      - "src/resonance/reputation/**"

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  exp041:
    uses: ./.github/workflows/phase-boundary-step.yml
    with:
      experiment_number: 41
    secrets: inherit

