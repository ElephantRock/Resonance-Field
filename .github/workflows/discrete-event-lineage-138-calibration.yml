name: Discrete Event Lineage Experiment 138 Calibration

on:
  push:
    branches: [main]
    paths:
      - "src/resonance/experiments/lineage_instrumentation_config.py"
      - "src/resonance/experiments/discrete_event_lineage_138.py"
      - "src/resonance/experiments/discrete_event_lineage_138_cli.py"
      - "configs/experiments/discrete-event-lineage-138.json"
      - "tests/test_discrete_event_lineage_138.py"
      - "docs/discrete-event-lineage-138.md"
      - ".github/workflows/discrete-event-lineage-138-calibration.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  calibration-138-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESONANCE_TEST_DSN: postgresql://resonance:resonance@localhost:5432/resonance
      OUTPUT_DIR: artifacts/discrete-event-lineage-138-calibration
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Run Experiment 138 v1 calibration only
        run: |
          python -m resonance.experiments.discrete_event_lineage_138_cli \
            --config configs/experiments/discrete-event-lineage-138.json \
            --code-sha "$GITHUB_SHA" \
            --output-dir "$OUTPUT_DIR"
      - name: Upload Experiment 138 calibration evidence
        uses: actions/upload-artifact@v4
        with:
          name: discrete-event-lineage-experiment-138-calibration-v1
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 90
      - name: Publish Experiment 138 calibration result
        run: |
          gh issue comment 70 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$OUTPUT_DIR/experiment-138-calibration-report.md"
