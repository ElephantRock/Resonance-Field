name: Adaptive Integration Experiments 014-040

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-campaign-014-040.yml"
      - "configs/experiments/integration-campaign-014-040.json"
      - "src/resonance/market/**"
      - "src/resonance/experiments/integration_campaign*.py"
      - "migrations/007_market_signals.sql"
      - "migrations/008_integration_campaign.sql"

permissions:
  contents: read
  issues: write

jobs:
  run-integration-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESONANCE_TEST_DSN: postgresql://resonance:resonance@localhost:5432/resonance
      OUTPUT_DIR: artifacts/integration-campaign-014-040

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python package
        run: pip install -e '.[dev]'
      - name: Run Experiments 014-040
        run: >-
          python -m resonance.experiments.integration_campaign_cli
          --config configs/experiments/integration-campaign-014-040.json
          --code-sha "$GITHUB_SHA"
          --output-dir "$OUTPUT_DIR"
      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-integration-experiments-014-040
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 90
      - name: Build lab notebook comments
        run: |
          mkdir -p "$OUTPUT_DIR/comments"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          data = json.loads((output / "campaign.json").read_text())
          comments = output / "comments"

          for experiment in data["experiments"]:
              number = experiment["number"]
              selected = next(
                  arm
                  for arm in experiment["arms"]
                  if arm["label"] == experiment["selected_label"]
              )
              metrics = selected["metrics"]
              invariants = selected["invariants"]
              lines = [
                  f"## Experiment {number:03d}",
                  "",
                  f"**Question:** {experiment['question']}",
                  "",
                  f"- Focus: `{experiment['focus']}`",
                  f"- Motivating failure: `{experiment['motivating_failure']}`",
                  f"- Observed failure: `{experiment['observed_failure']}`",
                  f"- Selected arm: `{experiment['selected_label']}`",
                  f"- Success: **{metrics['success_rate']:.6f}**",
                  f"- Agent/domain MI: **{metrics['agent_domain_mutual_information']:.6f}**",
                  f"- Specialization: **{metrics['mean_specialization']:.6f}**",
                  f"- Winner HHI: **{metrics['mean_winner_hhi']:.6f}**",
                  f"- Early incumbent share: **{metrics['early_incumbent_share']:.6f}**",
                  f"- Winner replacement: **{metrics['winner_replacement_rate']:.6f}**",
                  f"- Reputation Brier: **{metrics['reputation_brier_score']:.6f}**",
                  f"- Winning price/budget: **{metrics['mean_winning_price_fraction']:.6f}**",
                  f"- Credit Gini: **{metrics['credit_gini']:.6f}**",
                  f"- Feasible: **{selected['feasible']}**",
                  f"- Utility: **{selected['utility']:.6f}**",
                  f"- Hard invariants: **{all(invariants.values())}**",
                  f"- Decision: {experiment['decision']}",
                  f"- Next experiment focus: `{experiment['next_experiment_focus']}`",
                  "",
                  "Invariant detail:",
              ]
              for key, value in invariants.items():
                  lines.append(f"- `{key}`: **{value}**")
              lines.extend(["", "Top arms by constrained utility:"])
              for arm in sorted(
                  experiment["arms"],
                  key=lambda item: item["utility"],
                  reverse=True,
              )[:4]:
                  arm_metrics = arm["metrics"]
                  lines.append(
                      f"- `{arm['label']}` — utility {arm['utility']:.6f}; "
                      f"success {arm_metrics['success_rate']:.6f}; "
                      f"incumbent {arm_metrics['early_incumbent_share']:.6f}; "
                      f"Brier {arm_metrics['reputation_brier_score']:.6f}; "
                      f"feasible {arm['feasible']}"
                  )
              if number == 40:
                  lines.extend(
                      [
                          "",
                          f"- Final validation: **{experiment['validated']}**",
                          f"- Holdout shock: `{data['holdout_shock']}`",
                      ]
                  )
              (comments / f"experiment-{number:03d}.md").write_text("\n".join(lines) + "\n")

          final = data["experiments"][-1]
          summary_lines = [
              "## Adaptive Integration Campaign 014–040 — Final Synthesis",
              "",
              f"- Commit: `{data['code_sha']}`",
              f"- Final policy: `{data['final_label']}`",
              f"- Holdout shock: `{data['holdout_shock']}`",
              f"- Holdout validated: **{data['validated']}**",
              f"- Experiments completed: **{len(data['experiments'])}**",
              "",
              "Every experiment used the real PostgreSQL market path. The exact next focus was selected from the preceding experiment's measured failure. Raw evidence is retained in the workflow artifact `adaptive-integration-experiments-014-040`.",
          ]
          (comments / "campaign-summary.md").write_text("\n".join(summary_lines) + "\n")
          PY
      - name: Publish campaign notebook to issue 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in "$OUTPUT_DIR"/comments/experiment-*.md; do
            gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body-file "$file"
          done
          gh issue comment 15 --repo "$GITHUB_REPOSITORY" --body-file "$OUTPUT_DIR/comments/campaign-summary.md"
