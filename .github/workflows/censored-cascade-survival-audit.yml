name: Censored Cascade-Survival Audit

on:
  push:
    branches: [main]
    paths:
      - "src/resonance/experiments/censored_cascade_survival_audit.py"
      - "tests/test_censored_cascade_survival.py"
      - "docs/censored-cascade-survival-audit.md"
      - ".github/workflows/censored-cascade-survival-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Download retained #60 audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source
          gh run download 31534691558 \
            --repo "${{ github.repository }}" \
            --name post-crossing-reconvergence-audit \
            --dir source
          test -f source/pair-summary.csv
          test -f source/cycle-distance-components.csv

      - name: Run frozen survival audit
        run: |
          python -m resonance.experiments.censored_cascade_survival_audit \
            --pair-summary source/pair-summary.csv \
            --cycle-components source/cycle-distance-components.csv \
            --out-dir audit-output

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: censored-cascade-survival-audit
          path: audit-output/
          retention-days: 90

      - name: Publish audit result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 62 \
            --repo "${{ github.repository }}" \
            --body-file audit-output/censored-cascade-survival-report.md

      - name: Close completed audit issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close 62 \
            --repo "${{ github.repository }}" \
            --reason completed
