name: Z.AI Coding Endpoint Probe

on:
  push:
    branches:
      - experiment/piano-agent-runtime
    paths:
      - ".github/workflows/zai-coding-endpoint-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Z.AI credential
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "::error::ZAI_API_KEY is not available to Resonance-Field Actions"
            exit 2
          fi
      - name: Probe exact GLM-5.2 Phase 2 request shape
        shell: bash
        run: |
          set -euo pipefail
          body='{"model":"glm-5.2","messages":[{"role":"system","content":"Return exactly one JSON object with keys report and claims_success. report must be a non-empty string; claims_success must be boolean."},{"role":"user","content":"Report that this connectivity probe succeeded."}],"thinking":{"type":"disabled"},"do_sample":false,"temperature":0,"max_tokens":128,"stream":false,"response_format":{"type":"json_object"}}'
          status=$(curl --silent --show-error \
            --output /tmp/zai-coding-probe.json \
            --write-out '%{http_code}' \
            --request POST \
            'https://api.z.ai/api/coding/paas/v4/chat/completions' \
            --header "Authorization: Bearer $ZAI_API_KEY" \
            --header 'Accept-Language: en-US,en' \
            --header 'Content-Type: application/json' \
            --data "$body")
          echo "HTTP_STATUS=$status"
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path('/tmp/zai-coding-probe.json').read_text())
          safe = {
              'model': value.get('model'),
              'choices': value.get('choices'),
              'usage': value.get('usage'),
              'error': value.get('error'),
          }
          print(json.dumps(safe, indent=2, sort_keys=True))
          assert value.get('model') == 'glm-5.2'
          choices = value.get('choices')
          assert isinstance(choices, list) and len(choices) == 1
          content = choices[0]['message']['content']
          payload = json.loads(content)
          assert set(payload) == {'report', 'claims_success'}
          assert isinstance(payload['report'], str) and payload['report']
          assert isinstance(payload['claims_success'], bool)
          PY
          test "$status" -ge 200 -a "$status" -lt 300
