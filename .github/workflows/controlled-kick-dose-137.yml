name: Controlled Kick-Dose Experiment 137

on:
  push:
    branches: [main]
    paths:
      - "src/resonance/experiments/controlled_kick_dose_137.py"
      - "src/resonance/experiments/controlled_kick_dose_137_cli.py"
      - "tests/test_controlled_kick_dose_137.py"
      - "docs/controlled-kick-dose-137.md"
      - ".github/workflows/controlled-kick-dose-137.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  experiment-137:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESONANCE_TEST_DSN: postgresql://resonance:resonance@localhost:5432/resonance
      OUTPUT_DIR: artifacts/controlled-kick-dose-137
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Download validated Experiment 135 evidence
        uses: actions/download-artifact@v4
        with:
          name: controlled-kick-dose-experiment-135
          path: instrumentation-135
          run-id: 31550953622
          github-token: ${{ github.token }}
      - name: Run frozen Experiment 137 replication
        run: |
          python -m resonance.experiments.controlled_kick_dose_137_cli \
            --config configs/experiments/controlled-kick-dose-135-137.json \
            --instrumentation-135 instrumentation-135/experiment-135.json \
            --code-sha "$GITHUB_SHA" \
            --output-dir "$OUTPUT_DIR"
      - name: Upload Experiment 137 evidence
        uses: actions/upload-artifact@v4
        with:
          name: controlled-kick-dose-experiment-137
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
          retention-days: 90
      - name: Publish Experiment 137 replication result
        run: |
          gh issue comment 64 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$OUTPUT_DIR/experiment-137-report.md"
