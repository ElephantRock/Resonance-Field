name: Epistemic Substrate 138-141 Instrumentation

on:
  pull_request:
    paths:
      - "configs/experiments/epistemic-substrate-138-141.json"
      - "src/resonance/experiments/epistemic_substrate_config.py"
      - "src/resonance/experiments/epistemic_substrate_campaign.py"
      - "src/resonance/experiments/epistemic_substrate_cli.py"
      - "tests/test_epistemic_substrate_config.py"
      - "tests/test_epistemic_substrate_campaign.py"
      - "docs/epistemic-substrate-138-141.md"
      - ".github/workflows/epistemic-substrate-138-141.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUTPUT_FILE: artifacts/epistemic-substrate-138-141/instrumentation.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Apply safe Ruff fixes
        run: |
          ruff check --fix \
            src/resonance/experiments/epistemic_substrate_config.py \
            src/resonance/experiments/epistemic_substrate_campaign.py \
            src/resonance/experiments/epistemic_substrate_cli.py \
            tests/test_epistemic_substrate_config.py \
            tests/test_epistemic_substrate_campaign.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/resonance/experiments/epistemic_substrate_config.py \
              src/resonance/experiments/epistemic_substrate_campaign.py \
              src/resonance/experiments/epistemic_substrate_cli.py \
              tests/test_epistemic_substrate_config.py \
              tests/test_epistemic_substrate_campaign.py
            git commit -m "Apply Ruff safe fixes to Epistemic Substrate campaign"
            git push
          fi
      - name: Lint campaign
        run: |
          ruff check --output-format=github \
            src/resonance/experiments/epistemic_substrate_config.py \
            src/resonance/experiments/epistemic_substrate_campaign.py \
            src/resonance/experiments/epistemic_substrate_cli.py \
            tests/test_epistemic_substrate_config.py \
            tests/test_epistemic_substrate_campaign.py
      - name: Test campaign mechanics
        run: |
          pytest \
            tests/test_epistemic_substrate_config.py \
            tests/test_epistemic_substrate_campaign.py
      - name: Run non-inferential instrumentation
        run: |
          python -m resonance.experiments.epistemic_substrate_cli \
            --config configs/experiments/epistemic-substrate-138-141.json \
            --code-sha "$GITHUB_SHA" \
            --output "$OUTPUT_FILE"
      - name: Upload instrumentation evidence
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-substrate-138-141-instrumentation
          path: ${{ env.OUTPUT_FILE }}
          if-no-files-found: error
          retention-days: 90
