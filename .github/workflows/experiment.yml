name: Emergence Experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/experiment.yml"
      - "configs/experiments/**"
      - "src/resonance/experiments/**"
      - "migrations/004_experiments.sql"

permissions:
  contents: read
  issues: write

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        ablation: [full, no_market, no_decay]
        seed: [101, 202, 303]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resonance
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance -d resonance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RESONANCE_TEST_DSN: postgresql://resonance:resonance@localhost:5432/resonance
      OUTPUT_DIR: artifacts/${{ matrix.ablation }}-seed-${{ matrix.seed }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python package
        run: pip install -e '.[dev]'
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Run experiment
        run: >-
          python -m resonance.experiments.cli
          --config configs/experiments/first-emergence.json
          --ablation ${{ matrix.ablation }}
          --seed ${{ matrix.seed }}
          --code-sha "$GITHUB_SHA"
          --output-dir "$OUTPUT_DIR"
      - name: Export database
        run: >-
          pg_dump "$RESONANCE_TEST_DSN"
          --no-owner --no-privileges
          > "$OUTPUT_DIR/postgres.sql"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: emergence-${{ matrix.ablation }}-seed-${{ matrix.seed }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish lab notebook summary
        env:
          GH_TOKEN: ${{ github.token }}
          ABLATION: ${{ matrix.ablation }}
          SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY' > "$OUTPUT_DIR/lab-comment.md"
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          data = json.loads((output / "experiment.json").read_text())
          metrics = data["metrics"]
          print(f"### Cell `{os.environ['ABLATION']}` / seed `{os.environ['SEED']}`")
          print()
          print(f"- Run ID: `{data['run_id']}`")
          print(f"- Commit: `{data['code_sha']}`")
          print(f"- Events: **{metrics['event_count']}**")
          print(f"- Mean specialization: **{metrics['mean_specialization']:.6f}**")
          print(f"- Agent/action MI: **{metrics['agent_action_mutual_information']:.6f}**")
          print(f"- Compute Gini: **{metrics['compute_gini']:.6f}**")
          print(f"- Balance Gini: **{metrics['balance_gini']:.6f}**")
          print(f"- Compute spent: **{metrics['total_compute_spent']}**")
          print(f"- Tasks posted/completed/cancelled: **{metrics['tasks_posted']} / {metrics['tasks_completed']} / {metrics['tasks_cancelled']}**")
          print(f"- Bids submitted: **{metrics['bids_submitted']}**")
          print(f"- Generated traces: **{metrics['trace_count']}**")
          print(f"- Synthetic topic coverage: **{metrics['topic_coverage']:.6f}**")
          print(f"- Artifact: `emergence-{os.environ['ABLATION']}-seed-{os.environ['SEED']}`")
          PY
          gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body-file "$OUTPUT_DIR/lab-comment.md"
