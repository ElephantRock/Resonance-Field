name: Two-Timescale Experiments 053-062

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/two-timescale-053-062.yml"
      - ".github/workflows/two-timescale-step.yml"
      - "configs/experiments/two-timescale-053-062.json"
      - "scripts/upsert_issue_comment.py"
      - "src/resonance/experiments/two_timescale_*.py"
      - "src/resonance/experiments/integration_campaign.py"
      - "src/resonance/market/**"
      - "src/resonance/reputation/**"

concurrency:
  group: two-timescale-053-062
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  exp053:
    uses: ./.github/workflows/two-timescale-step.yml
    with:
      experiment_number: 53
    secrets: inherit

  exp054:
    needs: exp053
    uses: ./.github/workflows/two-timescale-step.yml
    with:
      experiment_number: 54
      previous_artifact: two-timescale-checkpoint-53
    secrets: inherit

  exp055:
    needs: exp054
    uses: ./.github/workflows/two-timescale-step.yml
    with:
      experiment_number: 55
      previous_artifact: two-timescale-checkpoint-54
    secrets: inherit

