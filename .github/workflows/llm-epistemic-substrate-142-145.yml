name: LLM Epistemic Substrate 142-145 Instrumentation

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "configs/experiments/llm-epistemic-substrate-142-145.json"
      - "configs/experiments/llm-epistemic-substrate-142-145-confirmatory-design.json"
      - "configs/corpora/llm-epistemic-142-145/**"
      - "docs/llm-epistemic-substrate-142-145.md"
      - "scripts/freeze_llm_epistemic_sources.py"
      - "scripts/seal_llm_epistemic_confirmatory.py"
      - "src/resonance/experiments/llm_epistemic_*.py"
      - "tests/test_llm_epistemic_*.py"
      - ".github/workflows/llm-epistemic-substrate-142-145.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUTPUT_DIR: artifacts/llm-epistemic-substrate-142-145
      CONFIG: configs/experiments/llm-epistemic-substrate-142-145.json
      PARENT_CONFIG: configs/experiments/epistemic-substrate-138-141.json
      PILOT_PLAN: configs/corpora/llm-epistemic-142-145/instrumentation-pilot.json
      PILOT_DIR: artifacts/llm-epistemic-substrate-142-145/pilot-corpus

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and optional LLM provider
        run: pip install -e '.[dev,llm]'
      - name: Lint replication layer
        run: |
          ruff check --output-format=github \
            scripts/freeze_llm_epistemic_sources.py \
            scripts/seal_llm_epistemic_confirmatory.py \
            src/resonance/experiments/llm_epistemic_config.py \
            src/resonance/experiments/llm_epistemic_corpus.py \
            src/resonance/experiments/llm_epistemic_events.py \
            src/resonance/experiments/llm_epistemic_ontology.py \
            src/resonance/experiments/llm_epistemic_replay.py \
            src/resonance/experiments/llm_epistemic_agents.py \
            src/resonance/experiments/llm_epistemic_openai.py \
            src/resonance/experiments/llm_epistemic_zai.py \
            src/resonance/experiments/llm_epistemic_scoring.py \
            src/resonance/experiments/llm_epistemic_instrumentation.py \
            src/resonance/experiments/llm_epistemic_instrumentation_cli.py \
            src/resonance/experiments/llm_epistemic_confirmatory_analysis.py \
            src/resonance/experiments/llm_epistemic_confirmatory_design.py \
            src/resonance/experiments/llm_epistemic_confirmatory_admissibility.py \
            src/resonance/experiments/llm_epistemic_confirmatory_seal.py \
            src/resonance/experiments/llm_epistemic_confirmatory_execution.py \
            src/resonance/experiments/llm_epistemic_confirmatory_cli.py \
            tests/test_llm_epistemic_config.py \
            tests/test_llm_epistemic_corpus.py \
            tests/test_llm_epistemic_events.py \
            tests/test_llm_epistemic_replay.py \
            tests/test_llm_epistemic_agents.py \
            tests/test_llm_epistemic_openai.py \
            tests/test_llm_epistemic_zai.py \
            tests/test_llm_epistemic_scoring.py \
            tests/test_llm_epistemic_instrumentation.py \
            tests/test_llm_epistemic_confirmatory_design.py \
            tests/test_llm_epistemic_confirmatory_seal.py \
            tests/test_llm_epistemic_confirmatory_execution.py
      - name: Test replication mechanics and provider contract
        run: pytest tests/test_llm_epistemic_*.py
      - name: Enforce instrumentation-only boundary
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          config_path = Path("configs/experiments/llm-epistemic-substrate-142-145.json")
          value = json.loads(config_path.read_text())
          if value["stage"] != "instrumentation_scaffold":
              raise SystemExit("142-145 workflow may only run the instrumentation scaffold")
          if value["corpus"]["confirmatory_cases_sealed"]:
              raise SystemExit("confirmatory corpus must remain inaccessible in instrumentation workflow")

          corpus_root = Path("configs/corpora/llm-epistemic-142-145")
          named_confirmatory = [
              path for path in corpus_root.rglob("*")
              if path.is_file() and "confirmatory" in path.as_posix().lower()
          ]
          if named_confirmatory:
              raise SystemExit(
                  "confirmatory corpus material present in instrumentation tree: "
                  f"{named_confirmatory}"
              )
          for manifest_path in corpus_root.rglob("*.json"):
              try:
                  payload = json.loads(manifest_path.read_text())
              except (json.JSONDecodeError, UnicodeDecodeError):
                  continue
              if not isinstance(payload, dict):
                  continue
              cases = payload.get("cases", [])
              if isinstance(cases, list) and any(
                  isinstance(case, dict) and case.get("cohort") == "confirmatory"
                  for case in cases
              ):
                  raise SystemExit(
                      f"confirmatory case content present in instrumentation tree: {manifest_path}"
                  )

          output = Path("artifacts/llm-epistemic-substrate-142-145")
          output.mkdir(parents=True, exist_ok=True)
          contract = {
              "campaign": value["name"],
              "stage": value["stage"],
              "confirmatory_access": False,
              "confirmatory_cases_evaluated": False,
              "config_sha256": hashlib.sha256(config_path.read_bytes()).hexdigest(),
              "parent_config_sha256": hashlib.sha256(
                  Path("configs/experiments/epistemic-substrate-138-141.json").read_bytes()
              ).hexdigest(),
          }
          (output / "instrumentation-contract.json").write_text(
              json.dumps(contract, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Freeze immutable pilot sources
        run: |
          python scripts/freeze_llm_epistemic_sources.py \
            --plan "$PILOT_PLAN" \
            --output-dir "$PILOT_DIR"
      - name: Upload instrumentation contract and frozen pilot corpus
        uses: actions/upload-artifact@v4
        with:
          name: llm-epistemic-substrate-142-145-instrumentation-contract
          path: |
            ${{ env.OUTPUT_DIR }}/instrumentation-contract.json
            ${{ env.PILOT_DIR }}/freeze-record.json
            ${{ env.PILOT_DIR }}/manifest.json
            ${{ env.PILOT_DIR }}/sources/
          if-no-files-found: error
          retention-days: 90
