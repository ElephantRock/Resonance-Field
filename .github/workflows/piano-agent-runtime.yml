name: PIANO Agent Runtime

on:
  push:
    branches:
      - experiment/piano-agent-runtime
  pull_request:
    paths:
      - src/resonance/experiments/piano_agent_runtime.py
      - src/resonance/experiments/piano_phase1_fixture.py
      - src/resonance/experiments/piano_phase2.py
      - tests/test_piano_agent_runtime.py
      - tests/test_piano_phase1_fixture.py
      - tests/test_piano_phase2.py
      - docs/piano-agent-runtime-experiment.md
      - docs/piano-phase2-model-experiment.md
      - .github/workflows/piano-agent-runtime.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint experimental contract
        run: >-
          ruff check
          src/resonance/experiments/piano_agent_runtime.py
          src/resonance/experiments/piano_phase1_fixture.py
          src/resonance/experiments/piano_phase2.py
          tests/test_piano_agent_runtime.py
          tests/test_piano_phase1_fixture.py
          tests/test_piano_phase2.py
      - name: Test experimental contract
        run: >-
          pytest
          tests/test_piano_agent_runtime.py
          tests/test_piano_phase1_fixture.py
          tests/test_piano_phase2.py
      - name: Emit Phase 1 fixture records
        run: |
          python -m resonance.experiments.piano_phase1_fixture --arm control --output /tmp/control.json
          python -m resonance.experiments.piano_phase1_fixture --arm treatment --output /tmp/treatment.json
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (Path('/tmp/control.json'), Path('/tmp/treatment.json')):
              value = json.loads(path.read_text())
              assert value['scientific_claim_allowed'] is False
              assert len(value['records']) == 3
          PY
