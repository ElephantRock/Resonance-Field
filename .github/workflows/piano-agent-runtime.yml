name: PIANO Agent Runtime

on:
  push:
    branches:
      - experiment/piano-agent-runtime
  pull_request:
    paths:
      - src/resonance/experiments/piano_agent_runtime.py
      - tests/test_piano_agent_runtime.py
      - docs/piano-agent-runtime-experiment.md
      - .github/workflows/piano-agent-runtime.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint experimental contract
        run: ruff check src/resonance/experiments/piano_agent_runtime.py tests/test_piano_agent_runtime.py
      - name: Test experimental contract
        run: pytest tests/test_piano_agent_runtime.py
